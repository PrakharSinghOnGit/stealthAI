name: Build And Release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build macOS release artifact
        run: ./mac/scripts/build_release.sh

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: stealthAI-macos
          path: mac/dist/stealthAI-macos.zip

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Windows release artifact
        shell: pwsh
        run: ./windows/scripts/build_release.ps1

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: stealthAI-windows
          path: windows/dist/stealthAI-windows-x64.zip

  publish-tagged-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-macos
      - build-windows
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish tagged release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/stealthAI-macos/stealthAI-macos.zip
            artifacts/stealthAI-windows/stealthAI-windows-x64.zip
          generate_release_notes: true
