name: Build And Release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build release artifact
        run: ./scripts/build_release.sh

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/stealthAI-macos.zip
          generate_release_notes: true

      - name: Publish commit prerelease
        if: startsWith(github.ref, 'refs/heads/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          SAFE_BRANCH="${GITHUB_REF_NAME//\//-}"
          TAG_NAME="commit-${SAFE_BRANCH}-${SHORT_SHA}"
          TITLE="Commit Build ${SAFE_BRANCH} ${SHORT_SHA}"

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/stealthAI-macos.zip --clobber
          else
            gh release create "$TAG_NAME" dist/stealthAI-macos.zip \
              --title "$TITLE" \
              --notes "Automated prerelease for commit ${GITHUB_SHA}" \
              --target "$GITHUB_SHA" \
              --prerelease
          fi
